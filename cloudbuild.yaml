steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/boparty/backend:$BUILD_ID'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/boparty/backend:$BUILD_ID'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:stable'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'boparty-backend'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/boparty/backend:$BUILD_ID'
      - '--region=europe-west1'
      - '--port=8080'
      - '--allow-unauthenticated'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/boparty/backend:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY